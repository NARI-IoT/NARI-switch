<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NARI Smart Switch</title>
  <meta name="theme-color" content="#090d16">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase Web SDKs (Compat for direct browser execution) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #141b2d;
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #0284c7;
      --accent: #38bdf8;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 60px 16px; }
    
    header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--card-border); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    
    .btn-auth {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .user-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
    .btn-add-top { background: var(--primary); color: white; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; }

    .sync-status { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 12px; text-align: right; width: 100%; max-width: 440px; }

    .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 18px; }
    
    .card { 
      background: var(--card-bg); 
      border: 1px solid var(--card-border); 
      border-radius: 24px; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.45); 
      cursor: pointer; 
      transition: border-color 0.2s; 
      user-select: none;
    }
    
    .card-main { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .dev-left { display: flex; align-items: center; gap: 14px; }
    .icon-box { width: 48px; height: 48px; border-radius: 14px; background: #1e293b; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; color: var(--text-muted); transition: 0.3s; }
    .icon-box.active { background: rgba(16, 185, 129, 0.18); color: var(--success); }
    .dev-info h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 2px; }
    .dev-info p { font-size: 0.76rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); display: inline-block; }
    
    .dev-actions { display: flex; align-items: center; gap: 8px; }
    .btn-toggle { min-width: 65px; padding: 10px 16px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
    .btn-off { background: #334155; color: #94a3b8; }
    .btn-on { background: var(--success); color: white; }
    .btn-share { background: #1e293b; border: 1px solid var(--card-border); color: var(--accent); width: 34px; height: 34px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; }
    .btn-del { background: transparent; border: none; color: var(--danger); font-size: 1.2rem; cursor: pointer; padding: 6px; }

    .sensor-drawer { 
      margin-top: 14px; 
      padding-top: 14px; 
      border-top: 1px dashed var(--card-border); 
      display: none; 
      flex-direction: column; 
      gap: 12px; 
    }
    .sensor-drawer.open { display: flex; }
    .drawer-title { font-size: 0.78rem; color: var(--accent); font-weight: 600; }
    select { 
      background: #090d16; 
      border: 1px solid var(--card-border); 
      color: #38bdf8; 
      padding: 10px 12px; 
      border-radius: 10px; 
      font-size: 0.85rem; 
      outline: none; 
      width: 100%; 
      cursor: pointer; 
    }
    .hint-label { font-size: 0.72rem; color: #64748b; margin-top: 4px; text-align: right; }

    /* Dual Custom Voice Command Inputs */
    .custom-voice-box {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
    }
    .voice-input-row { display: flex; flex-direction: column; gap: 4px; }
    .voice-input-row label { font-size: 0.74rem; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .custom-voice-input { background: #141b2d; border: 1px solid var(--card-border); color: var(--accent); padding: 8px 10px; border-radius: 8px; font-size: 0.84rem; outline: none; width: 100%; }

    /* Personal Clap Training & Cadence Panel */
    .clap-trainer-box {
      display: none;
      flex-direction: column;
      gap: 10px;
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
    }
    .trainer-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; font-weight: 600; color: var(--accent); }
    .trainer-actions { display: flex; gap: 8px; }
    .btn-train-clap {
      flex: 1;
      padding: 9px;
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: white;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
    }
    .btn-train-clap.listening { background: #dc2626; animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { opacity: 0.8; } to { opacity: 1.0; } }

    .clap-cadence-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px dashed var(--card-border);
    }
    .clap-cadence-row label { font-size: 0.74rem; color: var(--text-muted); font-weight: 600; }
    .select-cadence {
      background: #141b2d;
      border: 1px solid var(--card-border);
      color: #38bdf8;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 0.78rem;
      outline: none;
      cursor: pointer;
      width: auto;
    }

    /* Responsive Level & Match Bar */
    .meter-container { width: 100%; height: 8px; background: #090d16; border-radius: 4px; overflow: hidden; position: relative; display: none; border: 1px solid var(--card-border); }
    .meter-bar { width: 0%; height: 100%; background: #38bdf8; transition: width 0.04s ease-out; }
    .meter-threshold-line { position: absolute; top: 0; bottom: 0; left: 65%; width: 2px; background: #ef4444; }
    
    .sensor-feedback { font-size: 0.78rem; color: #fbbf24; display: none; align-items: center; gap: 8px; font-weight: 500; }
    .ai-badge { display: inline-block; padding: 2px 7px; border-radius: 6px; background: rgba(56, 189, 248, 0.15); color: var(--accent); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 100; }
    .modal-box { background: #141b2d; border: 1px solid var(--card-border); border-radius: 22px; width: 100%; max-width: 380px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .btn-close { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
    input[type=text] { background: #090d16; border: 1px solid var(--card-border); color: white; padding: 12px; border-radius: 10px; font-size: 0.9rem; outline: none; }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 13px; border-radius: 10px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="brand"><i class="fa-solid fa-bolt"></i> NARI Smart Home</div>
    <div class="header-actions">
      <div id="authContainer">
        <button class="btn-auth" onclick="handleGoogleSignIn()">
          <i class="fa-brands fa-google"></i> Login
        </button>
      </div>
      <button class="btn-add-top" onclick="openModal()" title="Add Device"><i class="fa-solid fa-plus"></i></button>
    </div>
  </header>

  <div class="sync-status" id="syncStatus">Storage: Local (Sign in with Google to sync across phones)</div>
  <div class="container" id="deviceList"></div>

  <div class="modal-overlay" id="pairModal">
    <div class="modal-box">
      <div class="modal-header">
        <span>Add Smart Switch</span>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <input type="text" id="devName" placeholder="Appliance Name (e.g. Bed Lamp)">
      <input type="text" id="devIp" placeholder="ESP Local IP (e.g. 192.168.1.10)">
      <button class="btn-primary" onclick="addDevice()">Pair Device</button>
    </div>
  </div>

  <script>
    // --- FIREBASE CONFIGURATION (Integrated from your project) ---
    const firebaseConfig = {
      apiKey: "AIzaSyBT88D5hdOmTLPBkclCSt-mOKF0IXYZZHE",
      authDomain: "nari-smart-home.firebaseapp.com",
      projectId: "nari-smart-home",
      storageBucket: "nari-smart-home.firebasestorage.app",
      messagingSenderId: "285100807860",
      appId: "1:285100807860:web:31a5c284f9c457111c29e1"
    };

    let currentUser = null;
    let db = null;
    let auth = null;

    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (err) {
      console.warn("Firebase initialization error:", err);
    }

    let devices = JSON.parse(localStorage.getItem("nari_devices") || "[]");
    let openDrawerIndex = null;
    let audioCtx = null;
    let micStream = null;
    let analyser = null;
    let animFrame = null;
    let voiceRecognizer = null;
    let diyIntervals = {};
    let isTrainingClap = false;
    let clapTrainingBuffer = [];

    // --- AUTHENTICATION & CLOUD SYNC SYSTEM ---
    if (auth) {
      auth.onAuthStateChanged(async (user) => {
        currentUser = user;
        const authContainer = document.getElementById("authContainer");
        const syncStatus = document.getElementById("syncStatus");

        if (user) {
          authContainer.innerHTML = `
            <button class="btn-auth" onclick="handleSignOut()" title="Click to Logout">
              <img class="user-avatar" src="${user.photoURL || 'https://via.placeholder.com/24'}" alt="user">
              <span>${user.displayName ? user.displayName.split(' ')[0] : 'User'}</span>
            </button>
          `;
          syncStatus.innerHTML = `<i class="fa-solid fa-cloud"></i> Synced with Google Account: <b>${user.email}</b>`;
          await loadDevicesFromCloud();
        } else {
          authContainer.innerHTML = `
            <button class="btn-auth" onclick="handleGoogleSignIn()">
              <i class="fa-brands fa-google"></i> Login
            </button>
          `;
          syncStatus.innerText = "Storage: Local (Sign in with Google to sync across phones)";
        }
        render();
      });
    }

    async function handleGoogleSignIn() {
      if (!auth) return alert("Firebase is initializing. Please try again.");
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
      } catch (err) {
        alert("Google Login Error: " + err.message);
      }
    }

    async function handleSignOut() {
      if (confirm("Sign out of your Google account?")) {
        await auth.signOut();
        render();
      }
    }

    async function loadDevicesFromCloud() {
      if (!currentUser || !db) return;
      try {
        const docRef = db.collection("users").doc(currentUser.uid);
        const doc = await docRef.get();
        if (doc.exists && doc.data().devices) {
          devices = doc.data().devices;
          localStorage.setItem("nari_devices", JSON.stringify(devices));
        } else if (devices.length > 0) {
          saveState();
        }
      } catch (err) {
        console.error("Cloud retrieval failed:", err);
      }
    }

    function saveState() {
      localStorage.setItem("nari_devices", JSON.stringify(devices));
      if (currentUser && db) {
        db.collection("users").doc(currentUser.uid).set({
          email: currentUser.email,
          updatedAt: Date.now(),
          devices: devices
        }).catch(err => console.error("Cloud save failed:", err));
      }
    }

    // --- 10-MINUTE EXPIRING LINK CHECK ---
    function checkUrlPairing() {
      const params = new URLSearchParams(window.location.search);
      const addName = params.get('add');
      const addIp = params.get('ip');
      const expiresAt = parseInt(params.get('exp'), 10);

      if (addName && addIp) {
        const now = Date.now();
        if (!expiresAt || isNaN(expiresAt) || now > expiresAt) {
          alert("⚠️ Pairing link expired (10-minute security limit). Ask for a fresh link.");
          window.history.replaceState({}, document.title, window.location.pathname);
          return;
        }

        const exists = devices.some(d => d.ip === addIp);
        if (!exists) {
          devices.push({
            name: decodeURIComponent(addName),
            ip: decodeURIComponent(addIp),
            state: false,
            mode: "none",
            voiceOn: "light on",
            voiceOff: "light off",
            clapProfile: null,
            clapCadence: "single"
          });
          saveState();
          alert(`✓ Added "${decodeURIComponent(addName)}"!`);
        }
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    function shareDevice(index) {
      const dev = devices[index];
      const base = window.location.origin + window.location.pathname;
      const expiryTimestamp = Date.now() + (10 * 60 * 1000);
      const shareUrl = `${base}?add=${encodeURIComponent(dev.name)}&ip=${encodeURIComponent(dev.ip)}&exp=${expiryTimestamp}`;

      if (navigator.share) {
        navigator.share({
          title: `NARI Switch: ${dev.name}`,
          text: `Add "${dev.name}" to your dashboard (Valid for 10 minutes on home Wi-Fi):`,
          url: shareUrl
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(shareUrl).then(() => {
          alert(`⏱️ 10-Minute Share Link Copied! Send it to your family on home Wi-Fi.`);
        }).catch(() => {
          prompt("Copy this 10-minute pairing link:", shareUrl);
        });
      }
    }

    function toggleDrawer(index) {
      openDrawerIndex = openDrawerIndex === index ? null : index;
      render();
    }

    function updateVoiceCommand(index, type, text) {
      const val = text.trim().toLowerCase();
      if (type === 'on') devices[index].voiceOn = val;
      if (type === 'off') devices[index].voiceOff = val;
      saveState();

      const feedback = document.getElementById(`feedback-${index}`);
      if (feedback && devices[index].mode === "voice-custom") {
        const onWord = devices[index].voiceOn || "on";
        const offWord = devices[index].voiceOff || "off";
        feedback.innerHTML = `<span class="ai-badge">Voice Active (en-IN)</span> <span>Say "<b>${onWord}</b>" or "<b>${offWord}</b>"</span>`;
      }
    }

    function updateClapCadence(index, cadence) {
      devices[index].clapCadence = cadence;
      saveState();
      handleModeChange(index, "trained-clap");
    }

    function render() {
      const list = document.getElementById("deviceList");
      list.innerHTML = "";

      if (devices.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding:50px; color:var(--text-muted);"><p>No switches found.<br>Tap <b>+</b> to pair one or log in to sync saved devices.</p></div>`;
        return;
      }

      devices.forEach((dev, index) => {
        const isOpen = openDrawerIndex === index;
        const currentMode = dev.mode || "none";
        const voiceOn = dev.voiceOn !== undefined ? dev.voiceOn : "light on";
        const voiceOff = dev.voiceOff !== undefined ? dev.voiceOff : "light off";
        const clapCadence = dev.clapCadence || "single";
        const hasTrainedClap = dev.clapProfile && dev.clapProfile.length > 0;
        const card = document.createElement("div");
        card.className = "card";
        card.id = `card-${index}`;
        
        card.onclick = (e) => {
          if (e.target.closest('.dev-actions') || e.target.closest('.sensor-drawer')) return;
          toggleDrawer(index);
        };

        card.innerHTML = `
          <div class="card-main">
            <div class="dev-left">
              <div class="icon-box ${dev.state ? 'active' : ''}" id="icon-${index}">
                <i class="fa-solid ${dev.state ? 'fa-lightbulb' : 'fa-power-off'}"></i>
              </div>
              <div class="dev-info">
                <h3>${dev.name}</h3>
                <p><span class="status-dot"></span>${dev.ip}</p>
              </div>
            </div>
            <div class="dev-actions">
              <button class="btn-toggle ${dev.state ? 'btn-on' : 'btn-off'}" id="btn-toggle-${index}" onclick="event.stopPropagation(); toggleDevice(${index});">
                ${dev.state ? 'ON' : 'OFF'}
              </button>
              <button class="btn-share" onclick="event.stopPropagation(); shareDevice(${index});" title="Share with family (10-min link)">
                <i class="fa-solid fa-share-nodes"></i>
              </button>
              <button class="btn-del" onclick="event.stopPropagation(); deleteDevice(${index});">✕</button>
            </div>
          </div>

          <div class="hint-label">${isOpen ? '▲ Collapse options' : '▼ Tap card to open AI & sensor modes'}</div>
          
          <div class="sensor-drawer ${isOpen ? 'open' : ''}">
            <div class="drawer-title">
              <i class="fa-solid fa-brain"></i> Acoustic & Gesture Modes
            </div>
            <select onclick="event.stopPropagation();" onchange="handleModeChange(${index}, this.value)">
              <option value="none" ${currentMode === 'none' ? 'selected' : ''}>Standard Manual Mode</option>
              <option value="voice-custom" ${currentMode === 'voice-custom' ? 'selected' : ''}>Custom Voice Commands (Any Word ON & OFF)</option>
              <option value="trained-clap" ${currentMode === 'trained-clap' ? 'selected' : ''}>Personalized Fingerprint Clap (Your Hands Only)</option>
              <option value="shake" ${currentMode === 'shake' ? 'selected' : ''}>Gesture: Shake Phone (Acc > 11g)</option>
              <option value="wrist" ${currentMode === 'wrist' ? 'selected' : ''}>Gesture: Wrist Flick (Gyro/Tilt)</option>
              <option value="flicker" ${currentMode === 'flicker' ? 'selected' : ''}>DIY: Auto-Strobe Cycle (500ms)</option>
            </select>

            <!-- Dual Custom Voice Commands -->
            <div class="custom-voice-box" id="voice-box-${index}" style="display: ${currentMode === 'voice-custom' ? 'flex' : 'none'};" onclick="event.stopPropagation();">
              <div class="voice-input-row">
                <label><i class="fa-solid fa-power-off" style="color:var(--success);"></i> Voice Command to Turn ON:</label>
                <input type="text" id="voice-on-${index}" class="custom-voice-input" value="${voiceOn}" placeholder="e.g. fan on, activate, start" oninput="updateVoiceCommand(${index}, 'on', this.value)">
              </div>
              <div class="voice-input-row">
                <label><i class="fa-solid fa-power-off" style="color:var(--danger);"></i> Voice Command to Turn OFF:</label>
                <input type="text" id="voice-off-${index}" class="custom-voice-input" value="${voiceOff}" placeholder="e.g. fan off, stop, sleep" oninput="updateVoiceCommand(${index}, 'off', this.value)">
              </div>
            </div>

            <!-- Personal Clap Profile Trainer -->
            <div class="clap-trainer-box" id="clap-trainer-box-${index}" style="display: ${currentMode === 'trained-clap' ? 'flex' : 'none'};" onclick="event.stopPropagation();">
              <div class="trainer-header">
                <span><i class="fa-solid fa-fingerprint"></i> Biometric Hand Fingerprint</span>
                <span id="profile-status-${index}" style="color:${hasTrainedClap ? '#10b981' : '#f59e0b'};">
                  ${hasTrainedClap ? '✓ Profile Saved' : 'No Profile Yet'}
                </span>
              </div>
              <div class="trainer-actions">
                <button class="btn-train-clap" id="btn-train-clap-${index}" onclick="startClapTraining(${index})">
                  <i class="fa-solid fa-hands-clapping"></i> Record 5 Personal Claps
                </button>
                ${hasTrainedClap ? `<button class="btn-train-clap" style="flex:0.4; background:#334155;" onclick="clearClapProfile(${index})">Reset</button>` : ''}
              </div>

              <div class="clap-cadence-row">
                <label><i class="fa-solid fa-sliders"></i> Trigger Mode:</label>
                <select class="select-cadence" onchange="updateClapCadence(${index}, this.value)">
                  <option value="single" ${clapCadence === 'single' ? 'selected' : ''}>Single Clap (👏 Instant)</option>
                  <option value="double" ${clapCadence === 'double' ? 'selected' : ''}>Double Clap (👏 .. 👏 Safe)</option>
                </select>
              </div>
            </div>

            <!-- Live Level & Match Bar -->
            <div class="meter-container" id="meter-box-${index}" style="display: ${currentMode === 'trained-clap' ? 'block' : 'none'};">
              <div class="meter-bar" id="meter-bar-${index}"></div>
              <div class="meter-threshold-line" title="Trigger Cutoff"></div>
            </div>
            
            <div class="sensor-feedback" id="feedback-${index}">
              <i class="fa-solid fa-robot"></i> <span>Ready</span>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function openModal() { document.getElementById("pairModal").style.display = "flex"; }
    function closeModal() { document.getElementById("pairModal").style.display = "none"; }

    function addDevice() {
      const name = document.getElementById("devName").value.trim();
      const ip = document.getElementById("devIp").value.trim();
      if (!name || !ip) return alert("Fill in both fields.");
      devices.push({ name, ip, state: false, mode: "none", voiceOn: "light on", voiceOff: "light off", clapProfile: null, clapCadence: "single" });
      saveState();
      render();
      closeModal();
    }

    function updateDeviceUI(index, state) {
      const btn = document.getElementById(`btn-toggle-${index}`);
      const iconBox = document.getElementById(`icon-${index}`);
      if (btn) {
        btn.className = `btn-toggle ${state ? 'btn-on' : 'btn-off'}`;
        btn.innerText = state ? 'ON' : 'OFF';
      }
      if (iconBox) {
        iconBox.className = `icon-box ${state ? 'active' : ''}`;
        iconBox.innerHTML = `<i class="fa-solid ${state ? 'fa-lightbulb' : 'fa-power-off'}"></i>`;
      }
    }

    function sendCommand(index, state) {
      const dev = devices[index];
      dev.state = state;
      saveState();
      updateDeviceUI(index, state);
      if (navigator.vibrate) navigator.vibrate(60);
      fetch(`http://${dev.ip}/toggle?state=${state ? 1 : 0}`, { mode: 'cors' }).catch(() => {});
    }

    function toggleDevice(index) {
      sendCommand(index, !devices[index].state);
    }

    function deleteDevice(index) {
      const dev = devices[index];
      if (confirm(`Remove switch ${dev.name}?`)) {
        devices.splice(index, 1);
        saveState();
        render();
      }
    }

    // --- AUDIO SYSTEM ---
    async function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      if (!micStream) micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      if (!analyser) {
        const source = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.05;
        source.connect(analyser);
      }
    }

    function extractFingerprint(freqData, timeData) {
      let peak = 0, sumSq = 0;
      for (let i = 0; i < timeData.length; i++) {
        const dev = Math.abs(timeData[i] - 128);
        if (dev > peak) peak = dev;
        sumSq += dev * dev;
      }
      const rms = Math.sqrt(sumSq / timeData.length) || 1;
      const crest = peak / rms;

      const bands = new Float32Array(16);
      let totalMag = 0;
      for (let b = 0; b < 16; b++) {
        let sum = 0;
        for (let j = b * 8; j < (b + 1) * 8; j++) sum += freqData[j];
        bands[b] = sum / 8;
        totalMag += bands[b];
      }
      if (totalMag > 0) {
        for (let b = 0; b < 16; b++) bands[b] /= totalMag;
      }
      return { bands, crest, peak };
    }

    function computeCosineSimilarity(vecA, vecB) {
      let dot = 0, normA = 0, normB = 0;
      for (let i = 0; i < vecA.length; i++) {
        dot += vecA[i] * vecB[i];
        normA += vecA[i] * vecA[i];
        normB += vecB[i] * vecB[i];
      }
      if (normA === 0 || normB === 0) return 0;
      return dot / (Math.sqrt(normA) * Math.sqrt(normB));
    }

    // --- CLAP TRAINING ---
    async function startClapTraining(index) {
      await initAudio();
      isTrainingClap = true;
      clapTrainingBuffer = [];

      const btn = document.getElementById(`btn-train-clap-${index}`);
      const feedback = document.getElementById(`feedback-${index}`);
      const meterBar = document.getElementById(`meter-bar-${index}`);
      const meterBox = document.getElementById(`meter-box-${index}`);

      if (meterBox) meterBox.style.display = "block";
      btn.classList.add("listening");
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Waiting for Clap 1 of 5...`;
      feedback.style.display = "flex";
      feedback.innerHTML = `<span class="ai-badge" style="background:#f59e0b; color:white;">TRAINING</span> <span>Clap 1 now...</span>`;

      const timeData = new Uint8Array(analyser.fftSize);
      const freqData = new Uint8Array(analyser.frequencyBinCount);
      let armed = true;

      const trainLoop = () => {
        if (!isTrainingClap) return;

        analyser.getByteTimeDomainData(timeData);
        analyser.getByteFrequencyData(freqData);

        const fp = extractFingerprint(freqData, timeData);
        const visualPct = Math.min(100, Math.round((fp.peak / 45) * 100));
        if (meterBar) {
          meterBar.style.width = `${visualPct}%`;
          meterBar.style.background = fp.peak > 14 ? '#10b981' : '#38bdf8';
        }

        if (fp.peak > 14 && fp.crest > 2.5 && armed) {
          armed = false;
          clapTrainingBuffer.push(Array.from(fp.bands));
          const count = clapTrainingBuffer.length;

          if (count < 5) {
            btn.innerHTML = `<i class="fa-solid fa-hands-clapping"></i> Waiting for Clap ${count + 1} of 5...`;
            feedback.innerHTML = `<span class="ai-badge" style="background:#10b981; color:white;">CLAP ${count} SAVED</span> <span>Clap again (${count + 1} of 5)...</span>`;
          } else {
            const profile = new Array(16).fill(0);
            for (let i = 0; i < 5; i++) {
              for (let b = 0; b < 16; b++) profile[b] += clapTrainingBuffer[i][b];
            }
            for (let b = 0; b < 16; b++) profile[b] /= 5;

            devices[index].clapProfile = profile;
            saveState();

            isTrainingClap = false;
            btn.classList.remove("listening");
            btn.innerHTML = `<i class="fa-solid fa-hands-clapping"></i> Retrain Hand Profile`;
            feedback.innerHTML = `<span class="ai-badge" style="background:#10b981; color:white;">PROFILE ACTIVE</span> <span>Trained! Ready to listen...</span>`;
            render();
            handleModeChange(index, "trained-clap");
            return;
          }
          setTimeout(() => { armed = true; }, 350);
        }
        requestAnimationFrame(trainLoop);
      };
      trainLoop();
    }

    function clearClapProfile(index) {
      devices[index].clapProfile = null;
      saveState();
      render();
      handleModeChange(index, "trained-clap");
    }

    // --- SENSOR MODES ---
    async function handleModeChange(index, mode) {
      devices[index].mode = mode;
      saveState();

      const feedback = document.getElementById(`feedback-${index}`);
      const meterBox = document.getElementById(`meter-box-${index}`);
      const meterBar = document.getElementById(`meter-bar-${index}`);
      const voiceBox = document.getElementById(`voice-box-${index}`);
      const trainerBox = document.getElementById(`clap-trainer-box-${index}`);
      
      if (animFrame) cancelAnimationFrame(animFrame);
      isTrainingClap = false;
      if (voiceRecognizer) {
        try { voiceRecognizer.stop(); } catch(e) {}
        voiceRecognizer = null;
      }
      window.ondevicemotion = null;
      if (diyIntervals[index]) clearInterval(diyIntervals[index]);

      if (meterBox) meterBox.style.display = "none";
      if (voiceBox) voiceBox.style.display = "none";
      if (trainerBox) trainerBox.style.display = "none";

      if (mode === "none") {
        if (feedback) feedback.style.display = "none";
        return;
      }
      if (feedback) feedback.style.display = "flex";

      // 1. UNIVERSAL ACCENT-OPTIMIZED VOICE RECOGNIZER
      if (mode === "voice-custom") {
        if (voiceBox) voiceBox.style.display = "flex";
        
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          feedback.innerHTML = `<span style="color:#ef4444;">Speech Recognition not supported in this browser.</span>`;
          return;
        }

        voiceRecognizer = new SpeechRec();
        voiceRecognizer.continuous = true;
        voiceRecognizer.interimResults = false;
        voiceRecognizer.maxAlternatives = 3;
        voiceRecognizer.lang = 'en-IN';

        const updateStatusText = () => {
          const inputOn = document.getElementById(`voice-on-${index}`);
          const inputOff = document.getElementById(`voice-off-${index}`);
          const onWord = (inputOn ? inputOn.value : (devices[index].voiceOn || "on")).trim();
          const offWord = (inputOff ? inputOff.value : (devices[index].voiceOff || "off")).trim();
          feedback.innerHTML = `<span class="ai-badge">Voice Active (en-IN)</span> <span>Say "<b>${onWord}</b>" or "<b>${offWord}</b>"</span>`;
        };
        updateStatusText();

        const similarity = (s1, s2) => {
          let longer = s1.toLowerCase(), shorter = s2.toLowerCase();
          if (s1.length < s2.length) { longer = s2; shorter = s1; }
          let longerLength = longer.length;
          if (longerLength === 0) return 1.0;
          
          let costs = [];
          for (let i = 0; i <= longer.length; i++) {
            let lastValue = i;
            for (let j = 0; j <= shorter.length; j++) {
              if (i === 0) costs[j] = j;
              else if (j > 0) {
                let newValue = costs[j - 1];
                if (longer.charAt(i - 1) !== shorter.charAt(j - 1)) {
                  newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                }
                costs[j - 1] = lastValue;
                lastValue = newValue;
              }
            }
            if (i > 0) costs[shorter.length] = lastValue;
          }
          return (longerLength - costs[shorter.length]) / parseFloat(longerLength);
        };

        voiceRecognizer.onresult = (evt) => {
          const resultObj = evt.results[evt.results.length - 1];
          const heardCandidates = [];
          for (let a = 0; a < resultObj.length; a++) {
            heardCandidates.push(resultObj[a].transcript.toLowerCase().trim());
          }

          const topHeard = heardCandidates[0] || "";
          feedback.innerHTML = `<span class="ai-badge">Heard</span> <span>"${topHeard}"</span>`;

          const inputOnElem = document.getElementById(`voice-on-${index}`);
          const inputOffElem = document.getElementById(`voice-off-${index}`);
          const liveOn = (inputOnElem ? inputOnElem.value : (devices[index].voiceOn || "")).toLowerCase().trim();
          const liveOff = (inputOffElem ? inputOffElem.value : (devices[index].voiceOff || "")).toLowerCase().trim();

          const testFuzzyMatch = (targetStr) => {
            if (!targetStr) return false;
            const target = targetStr.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").trim();

            return heardCandidates.some(phrase => {
              const cleanPhrase = phrase.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").trim();
              if (cleanPhrase.includes(target) || target.includes(cleanPhrase)) return true;

              const pWords = cleanPhrase.split(/\s+/);
              const tWords = target.split(/\s+/);
              const wordsMatch = tWords.every(tw => pWords.some(pw => similarity(pw, tw) > 0.70));
              if (wordsMatch) return true;

              return similarity(cleanPhrase, target) >= 0.72;
            });
          };

          if (testFuzzyMatch(liveOn)) {
            feedback.innerHTML = `<span class="ai-badge" style="background:#10b981; color:white;">MATCH</span> <span>Matched "${liveOn}"! Turning ON...</span>`;
            sendCommand(index, true);
            setTimeout(updateStatusText, 1400);
          } else if (testFuzzyMatch(liveOff)) {
            feedback.innerHTML = `<span class="ai-badge" style="background:#ef4444; color:white;">MATCH</span> <span>Matched "${liveOff}"! Turning OFF...</span>`;
            sendCommand(index, false);
            setTimeout(updateStatusText, 1400);
          }
        };

        voiceRecognizer.onerror = (e) => console.warn("Voice error:", e.error);
        voiceRecognizer.onend = () => {
          if (devices[index].mode === "voice-custom") {
            try { voiceRecognizer.start(); } catch(e) {}
          }
        };

        try { voiceRecognizer.start(); } catch(e) {}
      }

      // 2. PERSONALIZED FINGERPRINT CLAP (SINGLE / DOUBLE)
      else if (mode === "trained-clap") {
        if (trainerBox) trainerBox.style.display = "flex";
        if (meterBox) meterBox.style.display = "block";

        const profile = devices[index].clapProfile;
        const cadence = devices[index].clapCadence || "single";

        if (!profile) {
          feedback.innerHTML = `<span class="ai-badge">Setup</span> <span>Click "Record 5 Personal Claps" above to train.</span>`;
          return;
        }

        await initAudio();
        const modeLabel = cadence === "double" ? "Double Clap (👏 .. 👏)" : "Single Clap (👏)";
        feedback.innerHTML = `<span class="ai-badge" style="background:#10b981; color:white;">Active</span> <span>Listening for YOUR ${modeLabel}...</span>`;

        const timeData = new Uint8Array(analyser.fftSize);
        const freqData = new Uint8Array(analyser.frequencyBinCount);
        let armed = true;
        let lastTrigger = 0;
        let firstClapTime = 0;
        let isWaitingForSecond = false;

        function matchLoop() {
          analyser.getByteTimeDomainData(timeData);
          analyser.getByteFrequencyData(freqData);

          const fp = extractFingerprint(freqData, timeData);
          const matchScore = (fp.peak > 14 && fp.crest > 2.5) 
            ? computeCosineSimilarity(fp.bands, profile) 
            : 0;

          const matchPct = Math.round(matchScore * 100);
          const liveAmpPct = Math.min(100, Math.round((fp.peak / 45) * 100));

          if (meterBar) {
            if (isWaitingForSecond) {
              meterBar.style.width = '75%';
              meterBar.style.background = '#f59e0b';
            } else if (matchScore > 0.65) {
              meterBar.style.width = `${matchPct}%`;
              meterBar.style.background = '#10b981';
            } else {
              meterBar.style.width = `${liveAmpPct}%`;
              meterBar.style.background = '#38bdf8';
            }
          }

          const now = Date.now();
          const isPersonalClap = matchScore > 0.72 && fp.crest > 2.8;

          if (isPersonalClap && armed) {
            if (cadence === "single") {
              if (now - lastTrigger > 1200) {
                armed = false;
                lastTrigger = now;
                feedback.innerHTML = `<span class="ai-badge" style="background:#10b981; color:white;">MATCH</span> <span>✓ Single Clap Confirmed (${matchPct}%)</span>`;
                toggleDevice(index);
                setTimeout(() => {
                  armed = true;
                  if (feedback) feedback.innerHTML = `<span class="ai-badge" style="background:#10b981; color:white;">Active</span> <span>Listening for YOUR Single Clap (👏)...</span>`;
                }, 1000);
              }
            } else {
              armed = false;
              if (!isWaitingForSecond) {
                isWaitingForSecond = true;
                firstClapTime = now;
                feedback.innerHTML = `<span class="ai-badge" style="background:#f59e0b; color:white;">1st CLAP</span> <span>Clap once more quickly (👏)...</span>`;
                setTimeout(() => { armed = true; }, 150);
              } else {
                const delta = now - firstClapTime;
                if (delta >= 150 && delta <= 800) {
                  feedback.innerHTML = `<span class="ai-badge" style="background:#10b981; color:white;">MATCH</span> <span>✓ Double Clap Confirmed (${matchPct}%)</span>`;
                  toggleDevice(index);
                  isWaitingForSecond = false;
                  setTimeout(() => {
                    armed = true;
                    if (feedback) feedback.innerHTML = `<span class="ai-badge" style="background:#10b981; color:white;">Active</span> <span>Listening for YOUR Double Clap (👏 .. 👏)...</span>`;
                  }, 1100);
                }
              }
            }
          }

          if (isWaitingForSecond && (now - firstClapTime > 800)) {
            isWaitingForSecond = false;
            armed = true;
            feedback.innerHTML = `<span class="ai-badge" style="background:#10b981; color:white;">Active</span> <span>Listening for YOUR Double Clap (👏 .. 👏)...</span>`;
          }

          if (!armed && fp.peak < 8 && !isWaitingForSecond && (now - lastTrigger > 800)) {
            armed = true;
          }

          animFrame = requestAnimationFrame(matchLoop);
        }
        matchLoop();
      }

      // 3. Shake Gesture
      else if (mode === "shake") {
        feedback.innerHTML = `<i class="fa-solid fa-mobile-screen"></i> <span>Shake phone to toggle</span>`;
        let lastShake = 0;
        window.ondevicemotion = (e) => {
          const acc = e.accelerationIncludingGravity;
          if (!acc) return;
          const force = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z) - 9.81;
          if (force > 11.0 && Date.now() - lastShake > 1500) {
            lastShake = Date.now();
            toggleDevice(index);
          }
        };
      }

      // 4. Wrist Flick Gesture
      else if (mode === "wrist") {
        feedback.innerHTML = `<i class="fa-solid fa-hand"></i> <span>Flick wrist to toggle</span>`;
        let lastFlick = 0;
        window.ondevicemotion = (e) => {
          const acc = e.acceleration;
          if (!acc) return;
          const lateral = Math.sqrt(acc.x * acc.x + acc.y * acc.y);
          if (lateral > 14.0 && Date.now() - lastFlick > 1200) {
            lastFlick = Date.now();
            toggleDevice(index);
          }
        };
      }

      // 5. DIY Auto-Strobe
      else if (mode === "flicker") {
        feedback.innerHTML = `<i class="fa-solid fa-bolt"></i> <span>Strobing every 500ms...</span>`;
        let st = false;
        diyIntervals[index] = setInterval(() => {
          st = !st;
          sendCommand(index, st);
        }, 500);
      }
    }

    checkUrlPairing();
    render();
  </script>
