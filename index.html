<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NARI Smart Switch</title>
  <meta name="theme-color" content="#10281e">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase Web SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #0b1a13;
      --card-bg: #12241b;
      --card-border: rgba(52, 211, 153, 0.16);
      --primary: #10b981;
      --accent: #34d399;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f0fdf4;
      --text-muted: #86efac;
      --switch-off: #1e3a2b;
    }

    body.theme-emerald {
      --bg: #061e14;
      --card-bg: #0b2d1f;
      --card-border: rgba(16, 185, 129, 0.22);
      --primary: #059669;
      --accent: #10b981;
      --success: #10b981;
      --text-muted: #6ee7b7;
      --switch-off: #134e35;
    }
    body.theme-ocean {
      --bg: #090d16;
      --card-bg: #141b2d;
      --card-border: rgba(56, 189, 248, 0.16);
      --primary: #0284c7;
      --accent: #38bdf8;
      --success: #0284c7;
      --text-muted: #94a3b8;
      --switch-off: #1e293b;
    }
    body.theme-amber {
      --bg: #1a1208;
      --card-bg: #281d0f;
      --card-border: rgba(245, 158, 11, 0.2);
      --primary: #d97706;
      --accent: #fbbf24;
      --success: #f59e0b;
      --text-muted: #fcd34d;
      --switch-off: #452d14;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 14px 12px 60px 12px; transition: background 0.3s ease, color 0.3s ease; }
    
    header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--card-border); }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 1.12rem; font-weight: 700; color: var(--accent); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    
    .btn-auth {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 5px 10px;
      font-size: 0.74rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .user-avatar { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
    .btn-circle-top { background: var(--primary); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
    .btn-circle-top.btn-gear { background: rgba(255, 255, 255, 0.07); color: var(--accent); border: 1px solid var(--card-border); }

    .sync-status { font-size: 0.68rem; color: var(--text-muted); margin-bottom: 12px; text-align: right; width: 100%; max-width: 440px; }

    /* Compact Fixed Square Grid */
    .container { 
      width: 100%; 
      max-width: 440px; 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 12px; 
    }

    /* Fixed Size Square Smart Card */
    .card { 
      background: var(--card-bg); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: 1px solid var(--card-border); 
      border-radius: 20px; 
      padding: 12px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      aspect-ratio: 1 / 1; 
      height: 156px;
      box-shadow: 0 6px 18px -3px rgba(0,0,0,0.45); 
      cursor: pointer; 
      transition: all 0.4s ease; 
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    /* Default overlay tint for contrast */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: rgba(8, 16, 12, 0.68);
      transition: background 0.6s ease;
      z-index: 1;
    }
    .card > * { position: relative; z-index: 2; transition: opacity 0.6s ease; }

    /* Idle Inactive State: brighten picture, hide text, frosted switch */
    .card.idle-fade::before {
      background: rgba(8, 16, 12, 0.12); /* Image brightens */
    }
    .card.idle-fade .fading-label {
      opacity: 0;
      pointer-events: none;
    }
    .card.idle-fade .slider {
      background: rgba(255, 255, 255, 0.18) !important;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }
    .card.idle-fade .slider:before {
      background: rgba(255, 255, 255, 0.85);
    }

    /* Offline State */
    .card.device-offline {
      opacity: 0.42;
      filter: grayscale(0.85);
      border-color: rgba(239, 68, 68, 0.25);
    }
    .card.device-offline:hover { cursor: not-allowed; }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }

    /* Lightbulb Icon */
    .icon-box { 
      width: 36px; 
      height: 36px; 
      border-radius: 10px; 
      background: rgba(255, 255, 255, 0.08); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.05rem; 
      color: var(--text-muted); 
      transition: 0.25s; 
      cursor: pointer;
    }
    .icon-box:hover { background: rgba(52, 211, 153, 0.25); color: var(--accent); }
    .icon-box.active { background: rgba(16, 185, 129, 0.24); color: var(--success); }

    .top-right-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      position: relative;
    }

    /* Modern Pill Slider Switch */
    .switch-wrap { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch-wrap input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--switch-off);
      transition: 0.3s;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--success); }
    input:checked + .slider:before { transform: translateX(20px); }
    
    .switch-wrap.disabled { pointer-events: none; opacity: 0.45; }
    .switch-wrap.verifying .slider { background-color: #f59e0b !important; animation: pulse 0.7s infinite alternate; }
    @keyframes pulse { from { opacity: 0.6; } to { opacity: 1.0; } }

    /* Hidden Edit Button & Dropdown */
    .btn-edit-revealed {
      display: none;
      background: rgba(18, 36, 27, 0.95);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: pointer;
    }
    .edit-dropdown {
      display: none;
      position: absolute;
      top: 50px;
      right: 0;
      background: #0f1d16;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.7);
      width: 120px;
      z-index: 50;
      overflow: hidden;
    }
    .edit-dropdown.show { display: block; }
    .edit-menu-item {
      width: 100%;
      padding: 7px 9px;
      background: none;
      border: none;
      color: var(--text);
      font-size: 0.72rem;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .edit-menu-item:hover { background: rgba(52, 211, 153, 0.15); color: var(--accent); }
    .edit-menu-item.danger { color: #fca5a5; }

    /* Mid Info */
    .card-info { margin-top: 4px; }
    .card-info h3 { font-size: 0.92rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-info p { font-size: 0.66rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; margin-top: 2px; }

    .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .status-online { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .status-offline { background: var(--danger); }

    /* Card Bottom Row: AI Modes Trigger & Live Wi-Fi Symbol */
    .card-bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 2px;
    }
    .drawer-trigger { font-size: 0.65rem; color: rgba(255,255,255,0.45); cursor: pointer; }
    .wifi-badge { font-size: 0.68rem; color: var(--accent); display: flex; align-items: center; gap: 3px; }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.78); display: none; justify-content: center; align-items: center; padding: 16px; z-index: 100; }
    .modal-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; width: 100%; max-width: 360px; padding: 18px; display: flex; flex-direction: column; gap: 11px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 0.95rem; }
    .btn-close { background: none; border: none; color: var(--text-muted); font-size: 1.15rem; cursor: pointer; }
    
    input[type=text], select { background: rgba(0,0,0,0.35); border: 1px solid var(--card-border); color: white; padding: 9px; border-radius: 8px; font-size: 0.82rem; outline: none; width: 100%; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

    .btn-primary { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .theme-tile { padding: 10px; border-radius: 8px; border: 1px solid var(--card-border); display: flex; align-items: center; gap: 8px; font-size: 0.78rem; cursor: pointer; }
    .swatch { width: 16px; height: 16px; border-radius: 50%; }

    /* Auto Range Mode Slider */
    .range-box { display: flex; flex-direction: column; gap: 6px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; border: 1px solid var(--card-border); }
    .range-box label { font-size: 0.72rem; color: var(--accent); display: flex; justify-content: space-between; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <div class="brand"><i class="fa-solid fa-bolt"></i> NARI Smart Home</div>
    <div class="header-actions">
      <div id="authContainer">
        <button class="btn-auth" onclick="handleGoogleSignIn()"><i class="fa-brands fa-google"></i> Login</button>
      </div>
      <button class="btn-circle-top btn-gear" onclick="openThemeModal()"><i class="fa-solid fa-gear"></i></button>
      <button class="btn-circle-top" onclick="openModal()"><i class="fa-solid fa-plus"></i></button>
    </div>
  </header>

  <div class="sync-status" id="syncStatus">Storage: Local</div>
  <div class="container" id="deviceList"></div>

  <!-- Add Device Modal -->
  <div class="modal-overlay" id="pairModal">
    <div class="modal-box">
      <div class="modal-header">
        <span>Add Smart Switch</span>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <input type="text" id="devName" placeholder="Appliance Name (e.g. Bed Lamp)">
      <input type="text" id="devIp" placeholder="ESP IP (e.g. 192.168.1.10)">
      <button class="btn-primary" onclick="addDevice()">Pair Switch</button>
    </div>
  </div>

  <!-- Bulb Icon Settings Modal (Rename, Power-On Boot State, Photo) -->
  <div class="modal-overlay" id="bulbSettingsModal">
    <div class="modal-box">
      <div class="modal-header">
        <span id="bulbSettingsTitle">Appliance Settings</span>
        <button class="btn-close" onclick="closeBulbModal()">✕</button>
      </div>

      <div class="form-group">
        <label>Rename Appliance:</label>
        <input type="text" id="modalDevName" placeholder="e.g. Living Room Light">
      </div>

      <div class="form-group">
        <label>Power-On Relay State (After Power Cut):</label>
        <select id="modalBootState">
          <option value="LAST">LAST STATE (Resume previous)</option>
          <option value="OFF">OFF STATE (Stay off on boot)</option>
          <option value="ON">ON STATE (Always turn on)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Custom Card Picture:</label>
        <input type="file" id="cardPhotoFile" accept="image/*" onchange="handlePhotoUpload(event)">
        <input type="text" id="cardPhotoUrl" placeholder="Or paste image URL (https://...)">
      </div>

      <div style="display:flex; gap:8px; margin-top:6px;">
        <button class="btn-primary" style="flex:1;" onclick="saveBulbSettings()">Save Changes</button>
        <button class="btn-primary" style="background:#475569; flex:0.4;" onclick="clearCardPhoto()">Clear Photo</button>
      </div>
    </div>
  </div>

  <!-- AI & Gesture Modes Modal (Opened without increasing card size) -->
  <div class="modal-overlay" id="aiModesModal">
    <div class="modal-box">
      <div class="modal-header">
        <span id="aiModesTitle">Smart Trigger Modes</span>
        <button class="btn-close" onclick="closeAiModal()">✕</button>
      </div>

      <div class="form-group">
        <label>Select Active Mode:</label>
        <select id="aiModeSelect" onchange="updateSelectedAiMode(this.value)">
          <option value="none">Standard Manual</option>
          <option value="auto-proximity">Auto Proximity (Room Presence)</option>
          <option value="voice-custom">Voice Commands (en-IN)</option>
          <option value="trained-clap">Fingerprint Clap</option>
          <option value="shake">Shake Phone</option>
          <option value="wrist">Wrist Flick</option>
        </select>
      </div>

      <!-- Auto Proximity Config -->
      <div class="range-box" id="proximityConfig" style="display:none;">
        <label>
          <span>Presence Distance Trigger</span>
          <b id="proximityLabel">65 ms (Room Range)</b>
        </label>
        <input type="range" id="proximitySlider" min="20" max="220" value="65" oninput="adjustProximityTrigger(this.value)">
        <p style="font-size:0.68rem; color:var(--text-muted); margin-top:4px;">
          Slides the sensitivity trigger point. Turns ON when entering room range; turns OFF when you step outside.
        </p>
      </div>

      <button class="btn-primary" onclick="closeAiModal()">Done</button>
    </div>
  </div>

  <!-- Theme Modal -->
  <div class="modal-overlay" id="themeModal">
    <div class="modal-box">
      <div class="modal-header">
        <span>Dashboard Theme</span>
        <button class="btn-close" onclick="closeThemeModal()">✕</button>
      </div>
      <div class="theme-grid">
        <div class="theme-tile" onclick="applyTheme('default')" style="background:#12241b;"><span class="swatch" style="background:#10b981;"></span> Light Green</div>
        <div class="theme-tile" onclick="applyTheme('emerald')" style="background:#0b2d1f;"><span class="swatch" style="background:#059669;"></span> Emerald</div>
        <div class="theme-tile" onclick="applyTheme('ocean')" style="background:#141b2d;"><span class="swatch" style="background:#0284c7;"></span> Sky Blue</div>
        <div class="theme-tile" onclick="applyTheme('amber')" style="background:#281d0f;"><span class="swatch" style="background:#f59e0b;"></span> Amber</div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDdWakuiPRF2ucBnEtJ2s77e0Gf7MK2djs",
      authDomain: "nari-smart-home.firebaseapp.com",
      projectId: "nari-smart-home",
      storageBucket: "nari-smart-home.firebasestorage.app",
      messagingSenderId: "285100807860",
      appId: "1:285100807860:web:31a5c284f9c457111c29e1"
    };

    let currentUser = null, db = null, auth = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (err) { console.error("Firebase init err:", err); }

    let devices = JSON.parse(localStorage.getItem("nari_devices") || "[]");
    let activeDeviceIndex = null;
    let idleTimer = null;

    // Theme initialization
    const savedTheme = localStorage.getItem("nari_theme") || "default";
    applyTheme(savedTheme, false);

    function applyTheme(t, save = true) {
      document.body.className = "";
      if (t !== "default") document.body.classList.add(`theme-${t}`);
      if (save) { localStorage.setItem("nari_theme", t); closeThemeModal(); }
    }
    function openThemeModal() { document.getElementById("themeModal").style.display = "flex"; }
    function closeThemeModal() { document.getElementById("themeModal").style.display = "none"; }

    // --- IDLE ACTIVITY DETECTOR (Brighten picture, hide text, frosted switch) ---
    function resetIdleTimer() {
      // Restore all text labels immediately upon touch/mouse
      document.querySelectorAll('.card').forEach(c => c.classList.remove('idle-fade'));
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        document.querySelectorAll('.card').forEach(c => c.classList.add('idle-fade'));
      }, 3500); // 3.5s of no interaction triggers idle fade
    }
    window.onload = resetIdleTimer;
    document.onmousemove = resetIdleTimer;
    document.ontouchstart = resetIdleTimer;
    document.onclick = resetIdleTimer;

    // Close menus on outside click
    document.addEventListener("click", () => {
      document.querySelectorAll('.edit-dropdown').forEach(el => el.classList.remove('show'));
      document.querySelectorAll('.btn-edit-revealed').forEach(el => el.style.display = 'none');
    });

    if (auth) {
      auth.onAuthStateChanged(async (user) => {
        currentUser = user;
        const authContainer = document.getElementById("authContainer");
        const syncStatus = document.getElementById("syncStatus");

        if (user) {
          authContainer.innerHTML = `
            <button class="btn-auth" onclick="handleSignOut()">
              <img class="user-avatar" src="${user.photoURL || 'https://via.placeholder.com/20'}" alt="user">
              <span>${user.displayName ? user.displayName.split(' ')[0] : 'User'}</span>
            </button>
          `;
          syncStatus.innerHTML = `<i class="fa-solid fa-cloud"></i> Synced: <b>${user.email}</b>`;
          await loadDevicesFromCloud();
        } else {
          authContainer.innerHTML = `<button class="btn-auth" onclick="handleGoogleSignIn()"><i class="fa-brands fa-google"></i> Login</button>`;
          syncStatus.innerText = "Storage: Local";
        }
        render();
      });
    }

    async function handleGoogleSignIn() {
      try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
      catch (e) { alert("Login error: " + e.message); }
    }
    async function handleSignOut() {
      if (confirm("Sign out?")) { await auth.signOut(); render(); }
    }

    async function loadDevicesFromCloud() {
      if (!currentUser || !db) return;
      try {
        const doc = await db.collection("users").doc(currentUser.uid).get();
        if (doc.exists && doc.data().devices) {
          devices = doc.data().devices;
          localStorage.setItem("nari_devices", JSON.stringify(devices));
        } else if (devices.length > 0) saveState();
      } catch (e) { console.error("Cloud fetch failed:", e); }
    }

    function saveState() {
      localStorage.setItem("nari_devices", JSON.stringify(devices));
      if (currentUser && db) {
        db.collection("users").doc(currentUser.uid).set({
          email: currentUser.email,
          updatedAt: Date.now(),
          devices: devices
        }).catch(() => {});
      }
    }

    // --- HARDWARE HEALTH & WI-FI RSSI CHECK ---
    async function checkDeviceHealth(dev) {
      const controller = new AbortController();
      const startT = performance.now();
      const timeoutId = setTimeout(() => controller.abort(), 1600);

      try {
        const res = await fetch(`http://${dev.ip}/ping`, { method: 'GET', signal: controller.signal });
        clearTimeout(timeoutId);
        const rtt = Math.round(performance.now() - startT);
        dev.rtt = rtt;

        if (res.ok) {
          const txt = await res.text();
          const rssiVal = parseInt(txt, 10);
          dev.wifiRssi = isNaN(rssiVal) ? -55 : rssiVal;
        } else {
          dev.wifiRssi = -60;
        }
        return true;
      } catch (e) {
        clearTimeout(timeoutId);
        dev.wifiRssi = null;
        return false;
      }
    }

    async function pollAllDevices() {
      if (devices.length === 0) return;
      let changed = false;

      for (let i = 0; i < devices.length; i++) {
        if (devices[i]._isVerifying) continue;
        const online = await checkDeviceHealth(devices[i]);
        if (devices[i].isOnline !== online) {
          devices[i].isOnline = online;
          changed = true;
        }

        // Auto Proximity Presence check
        if (devices[i].mode === 'auto-proximity' && online) {
          const threshold = devices[i].proximityThreshold || 65;
          const isNear = (devices[i].rtt || 999) <= threshold;
          if (isNear && !devices[i].state) {
            sendCommand(i, true);
          } else if (!isNear && devices[i].state) {
            sendCommand(i, false);
          }
        }
      }
      if (changed) render();
    }
    setInterval(pollAllDevices, 4500);

    function getWifiIcon(rssi, isOnline) {
      if (!isOnline || rssi === null) return `<i class="fa-solid fa-wifi" style="color:var(--danger); opacity:0.6;" title="Offline"></i>`;
      if (rssi >= -55) return `<i class="fa-solid fa-wifi" style="color:#10b981;" title="Strong Wi-Fi (${rssi} dBm)"></i>`;
      if (rssi >= -75) return `<i class="fa-solid fa-wifi" style="color:#38bdf8;" title="Good Wi-Fi (${rssi} dBm)"></i>`;
      return `<i class="fa-solid fa-wifi" style="color:#f59e0b;" title="Weak Wi-Fi (${rssi} dBm)"></i>`;
    }

    // --- RENDER DASHBOARD ---
    function render() {
      const list = document.getElementById("deviceList");
      list.innerHTML = "";

      if (devices.length === 0) {
        list.innerHTML = `<div style="grid-column: span 2; text-align:center; padding:35px 10px; color:var(--text-muted);"><p>No smart switches found.<br>Tap <b>+</b> to pair one.</p></div>`;
        return;
      }

      devices.forEach((dev, index) => {
        const isOnline = dev.isOnline !== false;
        const isVerifying = !!dev._isVerifying;
        const hasBg = !!dev.bgPhoto;

        const card = document.createElement("div");
        card.className = `card ${isOnline ? '' : 'device-offline'}`;
        card.id = `card-${index}`;
        if (hasBg) card.style.backgroundImage = `url("${dev.bgPhoto}")`;

        // Right-click / Long-press triggers Edit Menu
        card.oncontextmenu = (e) => triggerEditOption(index, e);
        let touchTimer = null;
        card.ontouchstart = (e) => { touchTimer = setTimeout(() => triggerEditOption(index, e), 500); };
        card.ontouchend = () => clearTimeout(touchTimer);

        card.innerHTML = `
          <div class="card-top">
            <!-- Bulb icon opens settings modal -->
            <div class="icon-box ${dev.state && isOnline ? 'active' : ''}" onclick="openBulbModal(${index}, event)" title="Appliance Settings">
              <i class="fa-solid ${!isOnline ? 'fa-plug-circle-xmark' : (dev.state ? 'fa-lightbulb' : 'fa-power-off')}"></i>
            </div>

            <div class="top-right-wrap">
              <!-- Pill Switch on Top Right -->
              <label class="switch-wrap ${!isOnline ? 'disabled' : ''} ${isVerifying ? 'verifying' : ''}" onclick="event.stopPropagation();">
                <input type="checkbox" id="toggle-input-${index}" ${dev.state ? 'checked' : ''} onchange="handleToggleClick(${index}, this)">
                <span class="slider"></span>
              </label>

              <!-- Hidden Edit Option -->
              <button class="btn-edit-revealed" id="btn-edit-${index}" onclick="toggleEditDropdown(${index}, event)">
                Edit ▾
              </button>

              <!-- Edit Dropdown (Share, Delete) -->
              <div class="edit-dropdown" id="edit-menu-${index}">
                <button class="edit-menu-item" onclick="event.stopPropagation(); shareDevice(${index});">
                  <i class="fa-solid fa-share-nodes"></i> Share Link
                </button>
                <button class="edit-menu-item danger" onclick="event.stopPropagation(); deleteDevice(${index});">
                  <i class="fa-solid fa-trash"></i> Delete Switch
                </button>
              </div>
            </div>
          </div>

          <div class="card-info fading-label">
            <h3>${dev.name}</h3>
            <p>
              <span class="status-dot ${isOnline ? 'status-online' : 'status-offline'}"></span>
              ${isOnline ? dev.ip : 'Powered Off'}
            </p>
          </div>

          <div class="card-bottom-bar fading-label">
            <div class="drawer-trigger" onclick="openAiModal(${index}, event)">
              ▼ AI Modes
            </div>
            <div class="wifi-badge">
              ${getWifiIcon(dev.wifiRssi, isOnline)}
            </div>
          </div>
        `;
        list.appendChild(card);
      });
      resetIdleTimer();
    }

    // --- TOGGLE EXECUTION WITH STRICT ACKNOWLEDGMENT ---
    async function handleToggleClick(index, checkboxElem) {
      const dev = devices[index];
      const targetState = checkboxElem.checked;
      checkboxElem.checked = dev.state; // lock slider until ACK

      if (dev.isOnline === false) {
        alert(`Cannot toggle: "${dev.name}" is powered down.`);
        return;
      }

      dev._isVerifying = true;
      render();

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 1800);

      try {
        const res = await fetch(`http://${dev.ip}/toggle?state=${targetState ? 1 : 0}`, {
          method: 'GET',
          mode: 'cors',
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error("Hardware failed");

        dev.state = targetState;
        dev.isOnline = true;
        dev._isVerifying = false;
        saveState();
        render();
        if (navigator.vibrate) navigator.vibrate(45);
      } catch (err) {
        clearTimeout(timeoutId);
        dev._isVerifying = false;
        dev.isOnline = false;
        saveState();
        render();
        alert(`⚠️ Could not reach "${dev.name}". Hardware is powered off.`);
      }
    }

    function triggerEditOption(index, e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      document.querySelectorAll('.btn-edit-revealed').forEach(el => el.style.display = 'none');
      const btn = document.getElementById(`btn-edit-${index}`);
      if (btn) btn.style.display = 'block';
    }

    function toggleEditDropdown(index, e) {
      e.stopPropagation();
      const menu = document.getElementById(`edit-menu-${index}`);
      const isVisible = menu.classList.contains('show');
      document.querySelectorAll('.edit-dropdown').forEach(el => el.classList.remove('show'));
      if (!isVisible) menu.classList.add('show');
    }

    // --- BULB MODAL: RENAME, BOOT STATE & PHOTO ---
    function openBulbModal(index, e) {
      e.stopPropagation();
      activeDeviceIndex = index;
      const dev = devices[index];
      document.getElementById("bulbSettingsTitle").innerText = `Settings: ${dev.name}`;
      document.getElementById("modalDevName").value = dev.name;
      document.getElementById("modalBootState").value = dev.bootState || "LAST";
      document.getElementById("cardPhotoUrl").value = dev.bgPhoto || "";
      document.getElementById("bulbSettingsModal").style.display = "flex";
    }
    function closeBulbModal() { document.getElementById("bulbSettingsModal").style.display = "none"; }

    async function saveBulbSettings() {
      if (activeDeviceIndex === null) return;
      const dev = devices[activeDeviceIndex];
      const newName = document.getElementById("modalDevName").value.trim();
      const newBoot = document.getElementById("modalBootState").value;
      const newPhoto = document.getElementById("cardPhotoUrl").value.trim();

      if (newName) dev.name = newName;
      dev.bootState = newBoot;
      dev.bgPhoto = newPhoto || dev.bgPhoto;

      // Send chosen boot relay state directly to ESP to save in EEPROM
      try {
        fetch(`http://${dev.ip}/setBootState?mode=${newBoot}`, { mode: 'cors' }).catch(() => {});
      } catch (e) {}

      saveState();
      render();
      closeBulbModal();
    }

    function handlePhotoUpload(e) {
      const file = e.target.files[0];
      if (!file || activeDeviceIndex === null) return;
      const reader = new FileReader();
      reader.onload = (uploadEvt) => {
        devices[activeDeviceIndex].bgPhoto = uploadEvt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function clearCardPhoto() {
      if (activeDeviceIndex === null) return;
      devices[activeDeviceIndex].bgPhoto = null;
      document.getElementById("cardPhotoUrl").value = "";
      saveState();
      render();
    }

    // --- AI MODES MODAL ---
    function openAiModal(index, e) {
      e.stopPropagation();
      activeDeviceIndex = index;
      const dev = devices[index];
      document.getElementById("aiModesTitle").innerText = `Modes: ${dev.name}`;
      document.getElementById("aiModeSelect").value = dev.mode || "none";
      document.getElementById("proximitySlider").value = dev.proximityThreshold || 65;
      document.getElementById("proximityLabel").innerText = `${dev.proximityThreshold || 65} ms`;
      updateSelectedAiMode(dev.mode || "none");
      document.getElementById("aiModesModal").style.display = "flex";
    }
    function closeAiModal() { document.getElementById("aiModesModal").style.display = "none"; }

    function updateSelectedAiMode(mode) {
      if (activeDeviceIndex === null) return;
      devices[activeDeviceIndex].mode = mode;
      document.getElementById("proximityConfig").style.display = (mode === 'auto-proximity') ? 'flex' : 'none';
      saveState();
    }

    function adjustProximityTrigger(val) {
      if (activeDeviceIndex === null) return;
      devices[activeDeviceIndex].proximityThreshold = parseInt(val, 10);
      document.getElementById("proximityLabel").innerText = `${val} ms`;
      saveState();
    }

    function openModal() { document.getElementById("pairModal").style.display = "flex"; }
    function closeModal() { document.getElementById("pairModal").style.display = "none"; }

    function addDevice() {
      const name = document.getElementById("devName").value.trim();
      const ip = document.getElementById("devIp").value.trim();
      if (!name || !ip) return alert("Fill in both fields.");
      devices.push({ 
        name, ip, state: false, mode: "none", 
        bootState: "LAST", bgPhoto: null, 
        proximityThreshold: 65, isOnline: true 
      });
      saveState();
      render();
      closeModal();
    }

    function deleteDevice(index) {
      if (confirm(`Remove switch "${devices[index].name}"?`)) {
        devices.splice(index, 1);
        saveState();
        render();
      }
    }

    function shareDevice(index) {
      const dev = devices[index];
      const expiry = Date.now() + (10 * 60 * 1000);
      const shareUrl = `${window.location.origin}${window.location.pathname}?add=${encodeURIComponent(dev.name)}&ip=${encodeURIComponent(dev.ip)}&exp=${expiry}`;
      navigator.clipboard.writeText(shareUrl).then(() => alert("Share link copied (10 min expiry)!"));
    }

    render();
    pollAllDevices();
  </script>
</body>
</html>
