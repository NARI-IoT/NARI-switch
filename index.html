<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NARI Smart Switch</title>
  <meta name="theme-color" content="#090d16">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase Web SDKs (Compat for direct browser execution) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #141b2d;
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #0284c7;
      --accent: #38bdf8;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 60px 16px; }
    
    header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--card-border); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    
    .btn-auth {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .user-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
    .btn-add-top { background: var(--primary); color: white; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; }

    .sync-status { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 14px; text-align: right; width: 100%; max-width: 480px; }

    /* Dashboard Grid of Square Cards */
    .container { 
      width: 100%; 
      max-width: 480px; 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 14px; 
    }

    /* Square Card Style */
    .card { 
      background: var(--card-bg); 
      border: 1px solid var(--card-border); 
      border-radius: 22px; 
      padding: 16px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      aspect-ratio: 1 / 1; 
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.45); 
      cursor: pointer; 
      transition: all 0.25s ease; 
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    /* When sensor drawer is expanded, let card expand dynamically */
    .card.drawer-active {
      aspect-ratio: auto;
      grid-column: span 2;
    }

    /* Dimmed Offline State */
    .card.device-offline {
      opacity: 0.38;
      filter: grayscale(0.9);
      border-color: rgba(239, 68, 68, 0.2);
    }
    .card.device-offline:hover { cursor: not-allowed; }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
    .icon-box { width: 44px; height: 44px; border-radius: 12px; background: #1e293b; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--text-muted); transition: 0.3s; }
    .icon-box.active { background: rgba(16, 185, 129, 0.18); color: var(--success); }

    .card-actions-mini { display: flex; align-items: center; gap: 4px; }
    .btn-icon-mini { background: transparent; border: none; color: var(--text-muted); font-size: 0.82rem; cursor: pointer; padding: 4px; border-radius: 6px; }
    .btn-icon-mini:hover { color: var(--accent); }
    .btn-icon-mini.del:hover { color: var(--danger); }

    .card-mid { margin-top: 10px; }
    .card-mid h3 { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-mid p { font-size: 0.72rem; color: var(--text-muted); display: flex; align-items: center; gap: 5px; margin-top: 2px; }

    .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .status-online { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .status-offline { background: var(--danger); }

    .card-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .state-label { font-size: 0.76rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .state-label.active { color: var(--success); }

    /* Modern Pill Slider Switch */
    .switch-wrap { position: relative; display: inline-block; width: 48px; height: 26px; }
    .switch-wrap input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: 0.25s;
      border-radius: 30px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: 0.25s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--success); }
    input:checked + .slider:before { transform: translateX(22px); }
    
    /* Disabled Slider (Offline or Verifying) */
    .switch-wrap.disabled { pointer-events: none; opacity: 0.45; }
    .switch-wrap.verifying .slider { background-color: #f59e0b !important; animation: pulse 0.7s infinite alternate; }
    @keyframes pulse { from { opacity: 0.6; } to { opacity: 1.0; } }

    .drawer-trigger { font-size: 0.68rem; color: #64748b; margin-top: 6px; text-align: center; width: 100%; cursor: pointer; }

    /* Drawer Styles */
    .sensor-drawer { 
      margin-top: 14px; 
      padding-top: 12px; 
      border-top: 1px dashed var(--card-border); 
      display: none; 
      flex-direction: column; 
      gap: 12px; 
      width: 100%;
    }
    .sensor-drawer.open { display: flex; }
    .drawer-title { font-size: 0.76rem; color: var(--accent); font-weight: 600; }
    select { 
      background: #090d16; 
      border: 1px solid var(--card-border); 
      color: #38bdf8; 
      padding: 8px 10px; 
      border-radius: 8px; 
      font-size: 0.82rem; 
      outline: none; 
      width: 100%; 
      cursor: pointer; 
    }

    .custom-voice-box {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px;
    }
    .voice-input-row { display: flex; flex-direction: column; gap: 4px; }
    .voice-input-row label { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); }
    .custom-voice-input { background: #141b2d; border: 1px solid var(--card-border); color: var(--accent); padding: 7px 10px; border-radius: 6px; font-size: 0.82rem; outline: none; width: 100%; }

    .clap-trainer-box {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px;
    }
    .trainer-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.74rem; font-weight: 600; color: var(--accent); }
    .trainer-actions { display: flex; gap: 6px; }
    .btn-train-clap {
      flex: 1;
      padding: 8px;
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-train-clap.listening { background: #dc2626; animation: pulse 1s infinite alternate; }

    .clap-cadence-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
      padding-top: 6px;
      border-top: 1px dashed var(--card-border);
    }
    .clap-cadence-row label { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
    .select-cadence { background: #141b2d; border: 1px solid var(--card-border); color: #38bdf8; padding: 5px 8px; border-radius: 6px; font-size: 0.76rem; width: auto; }

    .meter-container { width: 100%; height: 6px; background: #090d16; border-radius: 3px; overflow: hidden; position: relative; display: none; border: 1px solid var(--card-border); }
    .meter-bar { width: 0%; height: 100%; background: #38bdf8; transition: width 0.04s ease-out; }
    .meter-threshold-line { position: absolute; top: 0; bottom: 0; left: 65%; width: 2px; background: #ef4444; }
    
    .sensor-feedback { font-size: 0.75rem; color: #fbbf24; display: none; align-items: center; gap: 6px; font-weight: 500; }
    .ai-badge { display: inline-block; padding: 2px 6px; border-radius: 5px; background: rgba(56, 189, 248, 0.15); color: var(--accent); font-size: 0.68rem; font-weight: 700; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 100; }
    .modal-box { background: #141b2d; border: 1px solid var(--card-border); border-radius: 20px; width: 100%; max-width: 360px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .btn-close { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
    input[type=text] { background: #090d16; border: 1px solid var(--card-border); color: white; padding: 10px; border-radius: 8px; font-size: 0.88rem; outline: none; }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 11px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="brand"><i class="fa-solid fa-bolt"></i> NARI Smart Home</div>
    <div class="header-actions">
      <div id="authContainer">
        <button class="btn-auth" onclick="handleGoogleSignIn()">
          <i class="fa-brands fa-google"></i> Login
        </button>
      </div>
      <button class="btn-add-top" onclick="openModal()" title="Add Device"><i class="fa-solid fa-plus"></i></button>
    </div>
  </header>

  <div class="sync-status" id="syncStatus">Storage: Local</div>
  <div class="container" id="deviceList"></div>

  <div class="modal-overlay" id="pairModal">
    <div class="modal-box">
      <div class="modal-header">
        <span>Add Smart Switch</span>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <input type="text" id="devName" placeholder="Device Name (e.g. Bed Lamp)">
      <input type="text" id="devIp" placeholder="ESP IP (e.g. 192.168.1.10)">
      <button class="btn-primary" onclick="addDevice()">Pair Device</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDdWakuiPRF2ucBnEtJ2s77e0Gf7MK2djs",
      authDomain: "nari-smart-home.firebaseapp.com",
      projectId: "nari-smart-home",
      storageBucket: "nari-smart-home.firebasestorage.app",
      messagingSenderId: "285100807860",
      appId: "1:285100807860:web:31a5c284f9c457111c29e1"
    };

    let currentUser = null;
    let db = null;
    let auth = null;

    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (err) {
      console.error("Firebase init err:", err);
    }

    let devices = JSON.parse(localStorage.getItem("nari_devices") || "[]");
    let openDrawerIndex = null;
    let audioCtx = null;
    let micStream = null;
    let analyser = null;
    let animFrame = null;
    let voiceRecognizer = null;
    let diyIntervals = {};
    let isTrainingClap = false;
    let clapTrainingBuffer = [];

    if (auth) {
      auth.onAuthStateChanged(async (user) => {
        currentUser = user;
        const authContainer = document.getElementById("authContainer");
        const syncStatus = document.getElementById("syncStatus");

        if (user) {
          authContainer.innerHTML = `
            <button class="btn-auth" onclick="handleSignOut()" title="Click to Logout">
              <img class="user-avatar" src="${user.photoURL || 'https://via.placeholder.com/24'}" alt="user">
              <span>${user.displayName ? user.displayName.split(' ')[0] : 'User'}</span>
            </button>
          `;
          syncStatus.innerHTML = `<i class="fa-solid fa-cloud"></i> Synced: <b>${user.email}</b>`;
          await loadDevicesFromCloud();
        } else {
          authContainer.innerHTML = `
            <button class="btn-auth" onclick="handleGoogleSignIn()">
              <i class="fa-brands fa-google"></i> Login
            </button>
          `;
          syncStatus.innerText = "Storage: Local (Login to sync)";
        }
        render();
      });
    }

    async function handleGoogleSignIn() {
      if (!auth) return alert("Auth service not ready.");
      try {
        await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      } catch (err) {
        alert("Login Error: " + err.message);
      }
    }

    async function handleSignOut() {
      if (confirm("Sign out of Google?")) {
        await auth.signOut();
        render();
      }
    }

    async function loadDevicesFromCloud() {
      if (!currentUser || !db) return;
      try {
        const doc = await db.collection("users").doc(currentUser.uid).get();
        if (doc.exists && doc.data().devices) {
          devices = doc.data().devices;
          localStorage.setItem("nari_devices", JSON.stringify(devices));
        } else if (devices.length > 0) {
          saveState();
        }
      } catch (err) {
        console.error("Cloud fetch err:", err);
      }
    }

    function saveState() {
      localStorage.setItem("nari_devices", JSON.stringify(devices));
      if (currentUser && db) {
        db.collection("users").doc(currentUser.uid).set({
          email: currentUser.email,
          updatedAt: Date.now(),
          devices: devices
        }).catch(err => console.error("Cloud save err:", err));
      }
    }

    // --- PING HEALTH CHECK (Lightweight ping) ---
    async function checkDeviceOnline(dev) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 1600); // 1.6s timeout

      try {
        await fetch(`http://${dev.ip}/ping`, { 
          method: 'GET', 
          mode: 'no-cors', 
          signal: controller.signal 
        });
        clearTimeout(timeoutId);
        return true;
      } catch (e) {
        clearTimeout(timeoutId);
        return false;
      }
    }

    async function pollAllDevicesHealth() {
      if (devices.length === 0) return;
      let stateChanged = false;

      for (let i = 0; i < devices.length; i++) {
        if (devices[i]._isVerifying) continue;
        const online = await checkDeviceOnline(devices[i]);
        if (devices[i].isOnline !== online) {
          devices[i].isOnline = online;
          stateChanged = true;
        }
      }

      if (stateChanged) render();
    }

    setInterval(pollAllDevicesHealth, 5000);

    function checkUrlPairing() {
      const params = new URLSearchParams(window.location.search);
      const addName = params.get('add');
      const addIp = params.get('ip');
      const expiresAt = parseInt(params.get('exp'), 10);

      if (addName && addIp) {
        const now = Date.now();
        if (!expiresAt || isNaN(expiresAt) || now > expiresAt) {
          alert("Pairing link expired (10-minute security limit).");
          window.history.replaceState({}, document.title, window.location.pathname);
          return;
        }

        if (!devices.some(d => d.ip === addIp)) {
          devices.push({
            name: decodeURIComponent(addName),
            ip: decodeURIComponent(addIp),
            state: false,
            mode: "none",
            voiceOn: "light on",
            voiceOff: "light off",
            clapProfile: null,
            clapCadence: "single",
            isOnline: true
          });
          saveState();
          alert(`Added "${decodeURIComponent(addName)}"!`);
        }
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    function shareDevice(index) {
      const dev = devices[index];
      const expiry = Date.now() + (10 * 60 * 1000);
      const shareUrl = `${window.location.origin}${window.location.pathname}?add=${encodeURIComponent(dev.name)}&ip=${encodeURIComponent(dev.ip)}&exp=${expiry}`;

      if (navigator.share) {
        navigator.share({ title: `NARI Switch: ${dev.name}`, url: shareUrl }).catch(() => {});
      } else {
        navigator.clipboard.writeText(shareUrl).then(() => {
          alert("10-Minute Share Link Copied!");
        });
      }
    }

    function toggleDrawer(index) {
      if (devices[index].isOnline === false) return;
      openDrawerIndex = openDrawerIndex === index ? null : index;
      render();
    }

    function render() {
      const list = document.getElementById("deviceList");
      list.innerHTML = "";

      if (devices.length === 0) {
        list.innerHTML = `<div style="grid-column: span 2; text-align:center; padding:40px 10px; color:var(--text-muted);"><p>No smart switches found.<br>Tap <b>+</b> to pair one.</p></div>`;
        return;
      }

      devices.forEach((dev, index) => {
        const isOnline = dev.isOnline !== false;
        const isVerifying = !!dev._isVerifying;
        const isOpen = openDrawerIndex === index && isOnline;
        const currentMode = dev.mode || "none";
        const hasTrainedClap = dev.clapProfile && dev.clapProfile.length > 0;

        const card = document.createElement("div");
        card.className = `card ${isOnline ? '' : 'device-offline'} ${isOpen ? 'drawer-active' : ''}`;
        card.id = `card-${index}`;

        card.innerHTML = `
          <div class="card-top">
            <div class="icon-box ${dev.state && isOnline ? 'active' : ''}">
              <i class="fa-solid ${!isOnline ? 'fa-plug-circle-xmark' : (dev.state ? 'fa-lightbulb' : 'fa-power-off')}"></i>
            </div>
            <div class="card-actions-mini">
              <button class="btn-icon-mini" onclick="event.stopPropagation(); shareDevice(${index});" title="Share (10m)"><i class="fa-solid fa-share-nodes"></i></button>
              <button class="btn-icon-mini del" onclick="event.stopPropagation(); deleteDevice(${index});" title="Delete">✕</button>
            </div>
          </div>

          <div class="card-mid">
            <h3>${dev.name}</h3>
            <p>
              <span class="status-dot ${isOnline ? 'status-online' : 'status-offline'}"></span>
              ${isOnline ? dev.ip : 'Powered Off'}
            </p>
          </div>

          <div class="card-bottom">
            <span class="state-label ${dev.state && isOnline ? 'active' : ''}">
              ${!isOnline ? 'OFFLINE' : (isVerifying ? 'SYNCING...' : (dev.state ? 'ON' : 'OFF'))}
            </span>

            <!-- Modern Pill Toggle Switch -->
            <label class="switch-wrap ${!isOnline ? 'disabled' : ''} ${isVerifying ? 'verifying' : ''}" onclick="event.stopPropagation();">
              <input type="checkbox" id="toggle-input-${index}" ${dev.state ? 'checked' : ''} onchange="handleToggleClick(${index}, this)">
              <span class="slider"></span>
            </label>
          </div>

          <div class="drawer-trigger" onclick="toggleDrawer(${index})">
            ${!isOnline ? '✕ Hardware Offline' : (isOpen ? '▲ Hide Modes' : '▼ AI & Sensor Modes')}
          </div>

          <!-- Collapsible Drawer -->
          <div class="sensor-drawer ${isOpen ? 'open' : ''}">
            <div class="drawer-title"><i class="fa-solid fa-brain"></i> Acoustic & Gesture Modes</div>
            <select onchange="handleModeChange(${index}, this.value)">
              <option value="none" ${currentMode === 'none' ? 'selected' : ''}>Standard Manual Mode</option>
              <option value="voice-custom" ${currentMode === 'voice-custom' ? 'selected' : ''}>Voice Commands</option>
              <option value="trained-clap" ${currentMode === 'trained-clap' ? 'selected' : ''}>Fingerprint Clap</option>
              <option value="shake" ${currentMode === 'shake' ? 'selected' : ''}>Shake Phone</option>
              <option value="wrist" ${currentMode === 'wrist' ? 'selected' : ''}>Wrist Flick</option>
              <option value="flicker" ${currentMode === 'flicker' ? 'selected' : ''}>Auto Strobe (500ms)</option>
            </select>

            <div class="custom-voice-box" id="voice-box-${index}" style="display: ${currentMode === 'voice-custom' ? 'flex' : 'none'};">
              <div class="voice-input-row">
                <label>ON Command:</label>
                <input type="text" class="custom-voice-input" value="${dev.voiceOn || 'light on'}" oninput="updateVoiceCommand(${index}, 'on', this.value)">
              </div>
              <div class="voice-input-row">
                <label>OFF Command:</label>
                <input type="text" class="custom-voice-input" value="${dev.voiceOff || 'light off'}" oninput="updateVoiceCommand(${index}, 'off', this.value)">
              </div>
            </div>

            <div class="clap-trainer-box" id="clap-trainer-box-${index}" style="display: ${currentMode === 'trained-clap' ? 'flex' : 'none'};">
              <div class="trainer-header">
                <span><i class="fa-solid fa-fingerprint"></i> Biometric Clap</span>
                <span style="color:${hasTrainedClap ? '#10b981' : '#f59e0b'};">${hasTrainedClap ? '✓ Ready' : 'No Profile'}</span>
              </div>
              <div class="trainer-actions">
                <button class="btn-train-clap" id="btn-train-clap-${index}" onclick="startClapTraining(${index})">Record 5 Claps</button>
                ${hasTrainedClap ? `<button class="btn-train-clap" style="flex:0.4; background:#334155;" onclick="clearClapProfile(${index})">Reset</button>` : ''}
              </div>
              <div class="clap-cadence-row">
                <label>Trigger:</label>
                <select class="select-cadence" onchange="updateClapCadence(${index}, this.value)">
                  <option value="single" ${(dev.clapCadence || 'single') === 'single' ? 'selected' : ''}>Single Clap (👏)</option>
                  <option value="double" ${(dev.clapCadence || 'single') === 'double' ? 'selected' : ''}>Double Clap (👏 .. 👏)</option>
                </select>
              </div>
            </div>

            <div class="meter-container" id="meter-box-${index}" style="display: ${currentMode === 'trained-clap' ? 'block' : 'none'};">
              <div class="meter-bar" id="meter-bar-${index}"></div>
              <div class="meter-threshold-line"></div>
            </div>

            <div class="sensor-feedback" id="feedback-${index}">
              <i class="fa-solid fa-robot"></i> <span>Ready</span>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    // --- HARDWARE-CONFIRMED TOGGLE LOGIC ---
    async function handleToggleClick(index, checkboxElem) {
      const dev = devices[index];
      const targetState = checkboxElem.checked;

      // 1. Immediately revert checkbox visually until hardware confirms execution
      checkboxElem.checked = dev.state;

      if (dev.isOnline === false) {
        alert(`Cannot toggle: "${dev.name}" is powered down.`);
        return;
      }

      // 2. Lock UI into verification mode
      dev._isVerifying = true;
      render();

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 2000); // 2 second strict timeout

      try {
        const res = await fetch(`http://${dev.ip}/toggle?state=${targetState ? 1 : 0}`, {
          method: 'GET',
          mode: 'cors',
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (!res.ok) throw new Error("ESP rejected state change");

        // 3. Hardware explicitly verified ACK: Now safely flip state
        dev.state = targetState;
        dev.isOnline = true;
        dev._isVerifying = false;
        saveState();
        render();

        if (navigator.vibrate) navigator.vibrate(50);

      } catch (err) {
        clearTimeout(timeoutId);
        console.warn(`Toggle failed for ${dev.name}:`, err);

        // 4. Failed: Hardware is off/unreachable. Revert and lock as offline immediately
        dev._isVerifying = false;
        dev.isOnline = false;
        saveState();
        render();

        alert(`⚠️ Could not reach "${dev.name}". Device is powered off or disconnected. Switch has been locked.`);
      }
    }

    function openModal() { document.getElementById("pairModal").style.display = "flex"; }
    function closeModal() { document.getElementById("pairModal").style.display = "none"; }

    function addDevice() {
      const name = document.getElementById("devName").value.trim();
      const ip = document.getElementById("devIp").value.trim();
      if (!name || !ip) return alert("Fill in both fields.");
      devices.push({ 
        name, 
        ip, 
        state: false, 
        mode: "none", 
        voiceOn: "light on", 
        voiceOff: "light off", 
        clapProfile: null, 
        clapCadence: "single",
        isOnline: true
      });
      saveState();
      render();
      pollAllDevicesHealth();
      closeModal();
    }

    function deleteDevice(index) {
      if (confirm(`Remove switch "${devices[index].name}"?`)) {
        devices.splice(index, 1);
        saveState();
        render();
      }
    }

    function updateVoiceCommand(index, type, text) {
      if (type === 'on') devices[index].voiceOn = text.trim().toLowerCase();
      if (type === 'off') devices[index].voiceOff = text.trim().toLowerCase();
      saveState();
    }

    function updateClapCadence(index, cadence) {
      devices[index].clapCadence = cadence;
      saveState();
      handleModeChange(index, "trained-clap");
    }

    // --- SENSOR MODES (Acoustic / Gestures) ---
    async function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      if (!micStream) micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      if (!analyser) {
        const source = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.05;
        source.connect(analyser);
      }
    }

    function extractFingerprint(freqData, timeData) {
      let peak = 0, sumSq = 0;
      for (let i = 0; i < timeData.length; i++) {
        const dev = Math.abs(timeData[i] - 128);
        if (dev > peak) peak = dev;
        sumSq += dev * dev;
      }
      const rms = Math.sqrt(sumSq / timeData.length) || 1;
      const crest = peak / rms;

      const bands = new Float32Array(16);
      let totalMag = 0;
      for (let b = 0; b < 16; b++) {
        let sum = 0;
        for (let j = b * 8; j < (b + 1) * 8; j++) sum += freqData[j];
        bands[b] = sum / 8;
        totalMag += bands[b];
      }
      if (totalMag > 0) {
        for (let b = 0; b < 16; b++) bands[b] /= totalMag;
      }
      return { bands, crest, peak };
    }

    function computeCosineSimilarity(vecA, vecB) {
      let dot = 0, normA = 0, normB = 0;
      for (let i = 0; i < vecA.length; i++) {
        dot += vecA[i] * vecB[i];
        normA += vecA[i] * vecA[i];
        normB += vecB[i] * vecB[i];
      }
      if (normA === 0 || normB === 0) return 0;
      return dot / (Math.sqrt(normA) * Math.sqrt(normB));
    }

    async function startClapTraining(index) {
      await initAudio();
      isTrainingClap = true;
      clapTrainingBuffer = [];

      const btn = document.getElementById(`btn-train-clap-${index}`);
      const feedback = document.getElementById(`feedback-${index}`);
      const meterBar = document.getElementById(`meter-bar-${index}`);
      const meterBox = document.getElementById(`meter-box-${index}`);

      if (meterBox) meterBox.style.display = "block";
      btn.classList.add("listening");
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Clap 1 of 5...`;
      feedback.style.display = "flex";
      feedback.innerHTML = `<span class="ai-badge" style="background:#f59e0b; color:white;">TRAINING</span> <span>Clap 1 now...</span>`;

      const timeData = new Uint8Array(analyser.fftSize);
      const freqData = new Uint8Array(analyser.frequencyBinCount);
      let armed = true;

      const trainLoop = () => {
        if (!isTrainingClap) return;

        analyser.getByteTimeDomainData(timeData);
        analyser.getByteFrequencyData(freqData);

        const fp = extractFingerprint(freqData, timeData);
        const visualPct = Math.min(100, Math.round((fp.peak / 45) * 100));
        if (meterBar) {
          meterBar.style.width = `${visualPct}%`;
          meterBar.style.background = fp.peak > 14 ? '#10b981' : '#38bdf8';
        }

        if (fp.peak > 14 && fp.crest > 2.5 && armed) {
          armed = false;
          clapTrainingBuffer.push(Array.from(fp.bands));
          const count = clapTrainingBuffer.length;

          if (count < 5) {
            btn.innerHTML = `<i class="fa-solid fa-hands-clapping"></i> Clap ${count + 1} of 5...`;
            feedback.innerHTML = `<span class="ai-badge" style="background:#10b981; color:white;">SAVED ${count}</span> <span>Clap again (${count + 1} of 5)...</span>`;
          } else {
            const profile = new Array(16).fill(0);
            for (let i = 0; i < 5; i++) {
              for (let b = 0; b < 16; b++) profile[b] += clapTrainingBuffer[i][b];
            }
            for (let b = 0; b < 16; b++) profile[b] /= 5;

            devices[index].clapProfile = profile;
            saveState();

            isTrainingClap = false;
            btn.classList.remove("listening");
            btn.innerHTML = `Retrain Claps`;
            render();
            handleModeChange(index, "trained-clap");
            return;
          }
          setTimeout(() => { armed = true; }, 350);
        }
        requestAnimationFrame(trainLoop);
      };
      trainLoop();
    }

    function clearClapProfile(index) {
      devices[index].clapProfile = null;
      saveState();
      render();
      handleModeChange(index, "trained-clap");
    }

    async function handleModeChange(index, mode) {
      devices[index].mode = mode;
      saveState();

      const feedback = document.getElementById(`feedback-${index}`);
      const meterBox = document.getElementById(`meter-box-${index}`);
      const meterBar = document.getElementById(`meter-bar-${index}`);
      const voiceBox = document.getElementById(`voice-box-${index}`);
      const trainerBox = document.getElementById(`clap-trainer-box-${index}`);
      
      if (animFrame) cancelAnimationFrame(animFrame);
      isTrainingClap = false;
      if (voiceRecognizer) {
        try { voiceRecognizer.stop(); } catch(e) {}
        voiceRecognizer = null;
      }
      window.ondevicemotion = null;
      if (diyIntervals[index]) clearInterval(diyIntervals[index]);

      if (meterBox) meterBox.style.display = "none";
      if (voiceBox) voiceBox.style.display = "none";
      if (trainerBox) trainerBox.style.display = "none";

      if (mode === "none" || devices[index].isOnline === false) {
        if (feedback) feedback.style.display = "none";
        return;
      }
      if (feedback) feedback.style.display = "flex";

      if (mode === "voice-custom") {
        if (voiceBox) voiceBox.style.display = "flex";
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          feedback.innerHTML = `<span style="color:#ef4444;">Voice not supported.</span>`;
          return;
        }

        voiceRecognizer = new SpeechRec();
        voiceRecognizer.continuous = true;
        voiceRecognizer.interimResults = false;
        voiceRecognizer.lang = 'en-IN';

        const updateStatusText = () => {
          const onWord = devices[index].voiceOn || "light on";
          const offWord = devices[index].voiceOff || "light off";
          feedback.innerHTML = `<span class="ai-badge">Voice</span> <span>"${onWord}" / "${offWord}"</span>`;
        };
        updateStatusText();

        voiceRecognizer.onresult = (evt) => {
          const heard = evt.results[evt.results.length - 1][0].transcript.toLowerCase().trim();
          feedback.innerHTML = `<span class="ai-badge">Heard</span> <span>"${heard}"</span>`;

          const targetOn = (devices[index].voiceOn || "light on").toLowerCase();
          const targetOff = (devices[index].voiceOff || "light off").toLowerCase();

          if (heard.includes(targetOn)) {
            const chk = document.getElementById(`toggle-input-${index}`);
            if (chk) { chk.checked = true; handleToggleClick(index, chk); }
          } else if (heard.includes(targetOff)) {
            const chk = document.getElementById(`toggle-input-${index}`);
            if (chk) { chk.checked = false; handleToggleClick(index, chk); }
          }
        };

        voiceRecognizer.onend = () => {
          if (devices[index].mode === "voice-custom") {
            try { voiceRecognizer.start(); } catch(e) {}
          }
        };
        try { voiceRecognizer.start(); } catch(e) {}
      }

      else if (mode === "trained-clap") {
        if (trainerBox) trainerBox.style.display = "flex";
        if (meterBox) meterBox.style.display = "block";

        const profile = devices[index].clapProfile;
        const cadence = devices[index].clapCadence || "single";

        if (!profile) {
          feedback.innerHTML = `<span class="ai-badge">Setup</span> <span>Click "Record 5 Claps" to train.</span>`;
          return;
        }

        await initAudio();
        feedback.innerHTML = `<span class="ai-badge" style="background:#10b981; color:white;">Listening</span> <span>Hand Claps Active...</span>`;

        const timeData = new Uint8Array(analyser.fftSize);
        const freqData = new Uint8Array(analyser.frequencyBinCount);
        let armed = true;
        let lastTrigger = 0;
        let firstClapTime = 0;
        let isWaitingForSecond = false;

        function matchLoop() {
          analyser.getByteTimeDomainData(timeData);
          analyser.getByteFrequencyData(freqData);

          const fp = extractFingerprint(freqData, timeData);
          const matchScore = (fp.peak > 14 && fp.crest > 2.5) ? computeCosineSimilarity(fp.bands, profile) : 0;
          const matchPct = Math.round(matchScore * 100);

          if (meterBar) {
            meterBar.style.width = `${Math.min(100, Math.round((fp.peak / 45) * 100))}%`;
            meterBar.style.background = matchScore > 0.65 ? '#10b981' : '#38bdf8';
          }

          const now = Date.now();
          const isPersonalClap = matchScore > 0.72 && fp.crest > 2.8;

          if (isPersonalClap && armed) {
            if (cadence === "single") {
              if (now - lastTrigger > 1200) {
                armed = false;
                lastTrigger = now;
                const chk = document.getElementById(`toggle-input-${index}`);
                if (chk) { chk.checked = !devices[index].state; handleToggleClick(index, chk); }
                setTimeout(() => { armed = true; }, 1000);
              }
            } else {
              armed = false;
              if (!isWaitingForSecond) {
                isWaitingForSecond = true;
                firstClapTime = now;
                setTimeout(() => { armed = true; }, 150);
              } else {
                const delta = now - firstClapTime;
                if (delta >= 150 && delta <= 800) {
                  const chk = document.getElementById(`toggle-input-${index}`);
                  if (chk) { chk.checked = !devices[index].state; handleToggleClick(index, chk); }
                  isWaitingForSecond = false;
                  setTimeout(() => { armed = true; }, 1100);
                }
              }
            }
          }

          if (isWaitingForSecond && (now - firstClapTime > 800)) {
            isWaitingForSecond = false;
            armed = true;
          }

          if (!armed && fp.peak < 8 && !isWaitingForSecond && (now - lastTrigger > 800)) {
            armed = true;
          }

          animFrame = requestAnimationFrame(matchLoop);
        }
        matchLoop();
      }

      else if (mode === "shake") {
        feedback.innerHTML = `<i class="fa-solid fa-mobile-screen"></i> <span>Shake phone to toggle</span>`;
        let lastShake = 0;
        window.ondevicemotion = (e) => {
          const acc = e.accelerationIncludingGravity;
          if (!acc) return;
          const force = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z) - 9.81;
          if (force > 11.0 && Date.now() - lastShake > 1500) {
            lastShake = Date.now();
            const chk = document.getElementById(`toggle-input-${index}`);
            if (chk) { chk.checked = !devices[index].state; handleToggleClick(index, chk); }
          }
        };
      }

      else if (mode === "wrist") {
        feedback.innerHTML = `<i class="fa-solid fa-hand"></i> <span>Flick wrist to toggle</span>`;
        let lastFlick = 0;
        window.ondevicemotion = (e) => {
          const acc = e.acceleration;
          if (!acc) return;
          const lateral = Math.sqrt(acc.x * acc.x + acc.y * acc.y);
          if (lateral > 14.0 && Date.now() - lastFlick > 1200) {
            lastFlick = Date.now();
            const chk = document.getElementById(`toggle-input-${index}`);
            if (chk) { chk.checked = !devices[index].state; handleToggleClick(index, chk); }
          }
        };
      }
    }

    checkUrlPairing();
    render();
    pollAllDevicesHealth();
  </script>
</body>
