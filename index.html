<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NARI Smart Home</title>
  <meta name="description" content="NARI Smart Home: control your smart switches instantly over your home Wi-Fi and from anywhere via the cloud. Install it as an app, works offline on your local network.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="NARI Smart Home">
  <meta property="og:description" content="Control NARI smart switches over LAN and cloud with phone-sensor automations.">
  <meta property="og:image" content="icons/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0b1a13">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NARI Home">
  
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="css/app.css?v=1.2.2">

  <!-- MQTT client for WebSockets -->
  <script src="vendor/js/mqtt.min.js"></script>

  <!-- Firebase SDKs (Compat layer for Web Auth & Firestore sync) -->
  <script src="vendor/js/firebase-app-compat.js"></script>
  <script src="vendor/js/firebase-auth-compat.js"></script>
  <script src="vendor/js/firebase-firestore-compat.js"></script>

  <!-- Lightweight client-side QR Code generator (100% offline & free) -->
  <script src="vendor/js/qrcode.min.js"></script>
</head>
<body>
  <noscript><p style="padding:24px;color:#fff;font-family:sans-serif;">NARI Smart Home needs JavaScript enabled to run.</p></noscript>

  <!-- Left Slide-Out Sidebar Drawer -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="left-sidebar" id="leftSidebar"></aside>

  <!-- Top App Header -->
  <header>
    <div class="brand">
      <button class="icon-btn" id="btnMenu" title="Family &amp; Sharing Menu" style="margin-right:2px;">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="logo"><i class="fa-solid fa-house-signal"></i></div>
      <div>
        NARI Home
        <small>Smart Switch Control</small>
      </div>
    </div>
    <div class="header-actions">
      <div id="authContainer">
        <button class="btn-auth" id="btnLogin">
          <i class="fa-brands fa-google"></i> Login
        </button>
      </div>
      <button class="icon-btn" id="btnDiag" title="Connection status">
        <i class="fa-solid fa-heart-pulse"></i>
        <span class="dot hidden" id="diagDot"></span>
      </button>
      <button class="icon-btn" id="btnScenes" title="Smart Scenes &amp; Automations">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
      </button>
      <button class="icon-btn" id="btnShare" title="Family &amp; Guest Share">
        <i class="fa-solid fa-qrcode"></i>
      </button>
      <button class="icon-btn" id="btnSettings" title="Settings">
        <i class="fa-solid fa-gear"></i>
      </button>
      <button class="icon-btn primary" id="btnAdd" title="Add switch">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>
  </header>

  <!-- Connection & Status Bar -->
  <div class="status-strip" id="statusStrip"></div>

  <!-- System Warning & Mixed Content Banners -->
  <div id="banners" style="width: 100%; max-width: 520px;"></div>

  <!-- Responsive Device Grid -->
  <main class="container" id="deviceList"></main>

  <!-- Bottom Sheet / Modal Overlay -->
  <div class="overlay" id="overlay">
    <div class="sheet" id="sheet"></div>
  </div>

  <!-- Real-Time Toast Notifications -->
  <div class="toasts" id="toasts"></div>

  <!-- PWA Install Prompt -->
  <button class="fab-install" id="btnInstall">
    <i class="fa-solid fa-download"></i> Install app
  </button>

  <!-- App Architecture Scripts -->
  <script src="js/config.local.js" onerror="this.remove()"></script>
  <script src="js/config.js?v=1.2.2"></script>
  <script src="js/store.js?v=1.2.2"></script>
  <script src="js/transport.js?v=1.2.2"></script>
  <script src="js/audio.js?v=1.2.2"></script>
  <script src="js/sensors.js?v=1.2.2"></script>
  <script src="js/scenes.js?v=1.2.2"></script>
  <script src="js/app.js?v=1.2.2"></script>
  <script src="js/sharing.js?v=1.2.2"></script>
  <script>
    // Offline support: cache the app shell so the app opens (and LAN control works) with no internet.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((e) => console.warn("SW registration failed:", e));
      });
    }
  </script>
</body>
</html>
