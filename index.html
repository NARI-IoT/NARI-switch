<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>NARI Smart Home</title>
  <meta name="description" content="Control NARI smart switches over LAN and cloud with phone-sensor automations.">
  <meta name="theme-color" content="#0b1a13">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NARI Home">
  
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/app.css">

  <!-- MQTT client for WebSockets -->
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>

  <!-- Firebase SDKs (Compat layer for Web Auth & Firestore sync) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- Lightweight client-side QR Code generator (100% offline & free) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <!-- Top App Header -->
  <header>
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-house-signal"></i></div>
      <div>
        NARI Home
        <small>Smart Switch Control</small>
      </div>
    </div>
    <div class="header-actions">
      <div id="authContainer">
        <button class="btn-auth" id="btnLogin">
          <i class="fa-brands fa-google"></i> Login
        </button>
      </div>
      <button class="icon-btn" id="btnDiag" title="Connection status">
        <i class="fa-solid fa-heart-pulse"></i>
        <span class="dot hidden" id="diagDot"></span>
      </button>
      <button class="icon-btn" id="btnShare" title="Family & Guest Share">
        <i class="fa-solid fa-qrcode"></i>
      </button>
      <button class="icon-btn" id="btnSettings" title="Settings">
        <i class="fa-solid fa-gear"></i>
      </button>
      <button class="icon-btn primary" id="btnAdd" title="Add switch">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>
  </header>

  <!-- Connection & Status Bar -->
  <div class="status-strip" id="statusStrip"></div>

  <!-- System Warning & Mixed Content Banners -->
  <div id="banners" style="width: 100%; max-width: 520px;"></div>

  <!-- Responsive Device Grid -->
  <main class="container" id="deviceList"></main>

  <!-- Bottom Sheet / Modal Overlay -->
  <div class="overlay" id="overlay">
    <div class="sheet" id="sheet"></div>
  </div>

  <!-- Real-Time Toast Notifications -->
  <div class="toasts" id="toasts"></div>

  <!-- PWA Install Prompt -->
  <button class="fab-install" id="btnInstall">
    <i class="fa-solid fa-download"></i> Install app
  </button>

  <!-- App Architecture Scripts -->
  <script src="js/config.local.js" onerror="this.remove()"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/transport.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sensors.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
